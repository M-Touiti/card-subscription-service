server:
  port: 8080

spring:
  application:
    name: card-subscription-service

  # ── Datasource (H2 for local, override for prod) ─────────────────────────────
  datasource:
    url: jdbc:h2:mem:cardsubdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns the schema (db/migration in infrastructure)
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true  # databases created by Hibernate before Flyway start from V1

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: card-subscription-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: 4

# ── Application-specific Kafka topics ─────────────────────────────────────────
kafka:
  topics:
    card-events: card.events
    card-events-partitions: 12
    replicas: 1

# ── External card API ──────────────────────────────────────────────────────────
external:
  card-api:
    base-url: http://localhost:8081
    subscribe-path: /api/v1/subscribe-new-card

# ── Actuator & Prometheus ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ── Resilience4j Circuit Breaker ──────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      externalCardApi:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.demo.cardsubscription: DEBUG
    org.springframework.kafka: INFO
    org.springframework.web: INFO
    io.github.resilience4j: INFO
