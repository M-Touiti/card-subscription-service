<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="With three replicas, REST writes reach 3.04 times and Kafka processing 2.70 times the single-replica throughput, against 3.00 times for linear scaling."><title>REST scales about linearly; Kafka reaches 2.70x at 3 replicas</title><desc>With three replicas, REST writes reach 3.04 times and Kafka processing 2.70 times the single-replica throughput, against 3.00 times for linear scaling.</desc>
<style>
  svg { --surface:#fcfcfb; --primary:#0b0b0b; --secondary:#52514e; --muted:#6f6d68; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --ref:#898781; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --primary:#f0efec; --secondary:#c3c2b7; --muted:#a3a198; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --ref:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: var(--primary); }
  .sub { font-size: 12.5px; fill: var(--secondary); }
  .tick { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .axis-title { font-size: 12px; fill: var(--secondary); }
  .label { font-size: 12.5px; fill: var(--primary); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style><rect width="720" height="420" style="fill:var(--surface)"/><text class="title" x="20" y="30">REST scales about linearly; Kafka reaches 2.70x at 3 replicas</text><text class="sub" x="20" y="50">Medians of 3 runs. 12 partitions and 4 listener threads per replica.</text><line class="base" x1="62" x2="570" y1="368.0" y2="368.0"/><text class="tick" x="52" y="372.0" text-anchor="end">1.0x</text><line class="grid" x1="62" x2="570" y1="305.0" y2="305.0"/><text class="tick" x="52" y="309.0" text-anchor="end">1.5x</text><line class="grid" x1="62" x2="570" y1="242.0" y2="242.0"/><text class="tick" x="52" y="246.0" text-anchor="end">2.0x</text><line class="grid" x1="62" x2="570" y1="179.0" y2="179.0"/><text class="tick" x="52" y="183.0" text-anchor="end">2.5x</text><line class="grid" x1="62" x2="570" y1="116.0" y2="116.0"/><text class="tick" x="52" y="120.0" text-anchor="end">3.0x</text><text class="tick" x="62.0" y="388" text-anchor="middle">1</text><text class="tick" x="316.0" y="388" text-anchor="middle">2</text><text class="tick" x="570.0" y="388" text-anchor="middle">3</text><text class="axis-title" x="316.0" y="410" text-anchor="middle">Replicas</text><text class="axis-title" x="20" y="108">Throughput relative to 1 replica</text><polyline class="line" points="62.0,368.0 570.0,116.0" style="stroke:var(--ref);stroke-width:1.5"/><text class="label" x="580.0" y="130.0">Linear 3.00x</text><polyline class="line" points="62.0,368.0 316.0,215.3 570.0,110.6" style="stroke:var(--s1)"/><circle class="dot" cx="62.0" cy="368.0" r="5" style="fill:var(--s1)"/><circle class="dot" cx="316.0" cy="215.3" r="5" style="fill:var(--s1)"/><circle class="dot" cx="570.0" cy="110.6" r="5" style="fill:var(--s1)"/><text class="label" x="580.0" y="104.6">REST 3.04x</text><polyline class="line" points="62.0,368.0 316.0,309.2 570.0,154.3" style="stroke:var(--s2)"/><circle class="dot" cx="62.0" cy="368.0" r="5" style="fill:var(--s2)"/><circle class="dot" cx="316.0" cy="309.2" r="5" style="fill:var(--s2)"/><circle class="dot" cx="570.0" cy="154.3" r="5" style="fill:var(--s2)"/><text class="label" x="580.0" y="158.3">Kafka 2.70x</text><line x1="62" x2="82" y1="71" y2="71" class="line" style="stroke:var(--s1)"/><text class="tick" style="fill:var(--secondary)" x="88" y="75">REST writes (1 replica = 418 req/s)</text><line x1="302" x2="322" y1="71" y2="71" class="line" style="stroke:var(--s2)"/><text class="tick" style="fill:var(--secondary)" x="328" y="75">Kafka events (1 replica = 64.9 events/s)</text></svg>
